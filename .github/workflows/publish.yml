name: Publish Gem

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build gem
        run: gem build metricdeck.gemspec

      - name: Publish to GitHub Packages
        run: |
          mkdir -p ~/.gem
          printf -- "---\n:github: Bearer %s\n" "$GITHUB_TOKEN" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}" ./*.gem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
